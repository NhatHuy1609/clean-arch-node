services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: clean_arch
    ports:
      # 5433 to avoid clashing with a local PostgreSQL on 5432 (if any)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d clean_arch"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
